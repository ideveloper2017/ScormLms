name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-${{ github.event.workflow_run.head_sha }}
          path: artifacts/backend
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-${{ github.event.workflow_run.head_sha }}
          path: artifacts/frontend
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare deployment package
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Unexpected commit SHA: $HEAD_SHA" >&2
            exit 1
          }
          test -f artifacts/backend/ROOT.war
          test -f artifacts/frontend/index.html
          tar -C artifacts/frontend -czf frontend.tar.gz .
          cp artifacts/backend/ROOT.war ROOT.war
          sha256sum ROOT.war frontend.tar.gz > checksums.sha256

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY secret is required" >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS secret is required" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST secret is required" >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER secret is required" >&2; exit 1; }
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          case "$DEPLOY_PORT" in (*[!0-9]*|'') echo "DEPLOY_PORT must be numeric" >&2; exit 1;; esac

          RELEASE_ID="${HEAD_SHA}-${SOURCE_RUN_ID}-${RUN_ATTEMPT}"
          REMOTE_RELEASE_DIR="/var/tmp/scorm-lms/incoming/${RELEASE_ID}"
          SSH=(ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)

          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 700 '$REMOTE_RELEASE_DIR'"
          "${SCP[@]}" ROOT.war frontend.tar.gz checksums.sha256 "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_RELEASE_DIR/"
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$REMOTE_RELEASE_DIR' && sha256sum -c checksums.sha256 && sudo /usr/local/sbin/scorm-lms-deploy '$RELEASE_ID'"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
