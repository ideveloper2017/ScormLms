name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test and WAR
    runs-on: ubuntu-latest
    # Testcontainers integratsiya testlari ~28 daqiqa ishlaydi; 30 daqiqa chegarada edi.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # bytedeco libopencv_highgui (yuz tanish uchun yuklanadi) GTK2 ga bog'langan; runner'da yo'q.
      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk2.0-0t64 || sudo apt-get install -y -qq libgtk2.0-0

      - name: Test and build ROOT.war
        run: ./gradlew test bootWar --no-daemon

      # Job loglari faqat login bilan ochiladi; annotation va job summary esa run
      # sahifasida hamma uchun ko'rinadi, shuning uchun yiqilgan testlarni shu yerga chiqaramiz.
      - name: Report failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          failed = []
          for path in sorted(glob.glob("build/test-results/test/TEST-*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      detail = (problem.text or problem.get("message") or "").strip()
                      failed.append((case.get("classname"), case.get("name"), detail))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Failed backend tests: {len(failed)}\n\n")
              for classname, name, detail in failed:
                  summary.write(f"### {classname} > {name}\n```\n{detail[:3000]}\n```\n")
          def escape_data(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          def escape_property(value):
              return escape_data(value).replace(":", "%3A").replace(",", "%2C")
          for classname, name, detail in failed[:10]:
              first_line = detail.splitlines()[0] if detail else ""
              title = escape_property(f"{classname.split('.')[-1]} > {name}")
              print(f"::error title={title}::{escape_data(first_line[:900])}")
          if not failed:
              print("::error title=Backend build::No failed test reports found; compilation or bootWar failed")
          PY

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ github.sha }}
          path: build/reports/tests/test
          retention-days: 7

      - name: Upload backend artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ github.sha }}
          path: build/libs/ROOT.war
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  frontend:
    name: Frontend lint, test and build
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8080/api/v1' }}
      VITE_WS_URL: ${{ vars.VITE_WS_URL || 'ws://localhost:8080/ws' }}
      VITE_SCORM_CONTENT_ORIGIN: ${{ vars.VITE_SCORM_CONTENT_ORIGIN || 'http://localhost:8080' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require production frontend variables on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CONFIGURED_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          CONFIGURED_WS_URL: ${{ vars.VITE_WS_URL }}
          CONFIGURED_SCORM_ORIGIN: ${{ vars.VITE_SCORM_CONTENT_ORIGIN }}
        run: |
          test -n "$CONFIGURED_API_BASE_URL" || { echo "VITE_API_BASE_URL repository variable is required" >&2; exit 1; }
          test -n "$CONFIGURED_WS_URL" || { echo "VITE_WS_URL repository variable is required" >&2; exit 1; }
          test -n "$CONFIGURED_SCORM_ORIGIN" || { echo "VITE_SCORM_CONTENT_ORIGIN repository variable is required" >&2; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Upload frontend artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
