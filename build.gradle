plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    id 'war'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21'
    id "org.jetbrains.kotlin.kapt" version '2.2.21'
}

group = 'uz.scorm.lms.app'
version = '0.0.1-SNAPSHOT'
description = 'ScromLmsProjects'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // MUHIM: tashqi Tomcat'ga WAR deploy qilinadi, shuning uchun embedded Tomcat
    // WAR ichiga (WEB-INF/lib) qo'shilmasligi kerak — aks holda tashqi Tomcat bilan
    // to'qnashadi va Spring Boot jimgina ishga tushmaydi. providedRuntime shu uchun.
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'
    // JWT

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-configuration-processor'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    testImplementation 'io.projectreactor:reactor-test'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    
    // Database
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql:42.7.13'

    // Kotlin
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.21'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.21'
    
    // XML Processing
    implementation 'org.dom4j:dom4j:2.1.4'
    
    // Utils
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'commons-codec:commons-codec:1.19.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'

    // Computer Vision (OpenCV - bytedeco with native binaries)
    implementation 'org.bytedeco:opencv-platform:4.9.0-1.5.10'
    
    // Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    
    // Logging
    implementation 'io.github.microutils:kotlin-logging-jvm:3.0.5'
    
    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test-classic'
    // Historical upgrade tests exercise H2 compatibility used when these
    // migrations were introduced. H2 2.4 rejects their legacy CHECK metadata.
    testRuntimeOnly 'com.h2database:h2:2.3.232'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql:1.19.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    testImplementation 'io.mockk:mockk:1.13.8'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.1.0'
    
    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // Apache POI for Excel Processing
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '2g'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Docker o'rnatilmagan oddiy development kompyuterida tez tekshiruv.
// To'liq `test` vazifasi PostgreSQL Testcontainers integration testlarini ham
// bajaradi; bu vazifa esa faqat konteyner talab qilmaydigan testlarni ishlatadi.
tasks.register('testNoDocker', Test) {
    group = 'verification'
    description = 'Runs backend tests that do not require Docker/Testcontainers.'
    useJUnitPlatform()
    maxHeapSize = '2g'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    exclude '**/*IntegrationTest*'
    exclude '**/*EndToEndTest*'
    exclude '**/BackendApiRouteContractTest*'
    exclude '**/ScromLmsProjectsApplicationTests*'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('processResources') {
    from('docs/uat/decision-559-uat-evidence.json') {
        into 'uat'
    }
}

tasks.register('runtimeDependencyInventory') {
    group = 'verification'
    description = 'Prints the resolved runtime Maven coordinates for OSV auditing.'
    doLast {
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
            .collect { "${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}" }
            .unique()
            .sort()
            .each { println it }
    }
}

compileKotlin {
    kotlinOptions {
        freeCompilerArgs = ['-Xjsr305=strict']
        jvmTarget = '21'
    }
}

compileTestKotlin {
    kotlinOptions {
        freeCompilerArgs = ['-Xjsr305=strict']
        jvmTarget = '21'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

bootJar {
    archiveFileName = 'scorm-lms.jar'
}

// Tashqi Tomcat'ga deploy uchun WAR'ni ROOT.war qilib yasaymiz, shunda
// ilova context-path'siz (root: http://server/...) ishlaydi va frontend'ning
// /api/... chaqiruvlari to'g'ri keladi.
bootWar {
    archiveFileName = 'ROOT.war'
}

springBoot {
    buildInfo()
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict'
    }
}

//jte {
//    generate()
//    binaryStaticContent = true
//}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

tasks.named('test') {
    useJUnitPlatform()
}
