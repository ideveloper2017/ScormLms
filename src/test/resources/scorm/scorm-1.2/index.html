<!doctype html>
<html lang="uz">
<head><meta charset="utf-8"><title>SCORM 1.2 E2E</title></head>
<body>
  <h1>SCORM 1.2 E2E kursi</h1>
  <button id="commit" type="button">Natijani saqlash</button>
  <button id="finish" type="button">Kursni yakunlash</button>
  <script>
    const api = window.parent.API;
    api.LMSInitialize("");
    document.getElementById("commit").addEventListener("click", () => {
      api.LMSSetValue("cmi.core.lesson_status", "incomplete");
      api.LMSSetValue("cmi.core.score.raw", "72");
      api.LMSSetValue("cmi.core.session_time", "00:01:30");
      api.LMSCommit("");
    });
    document.getElementById("finish").addEventListener("click", () => {
      api.LMSSetValue("cmi.core.lesson_status", "passed");
      api.LMSFinish("");
    });
  </script>
</body>
</html>
