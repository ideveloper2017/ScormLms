server:
#    port: 8080
#    servlet:
#        context-path: /api
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
      min-response-size: 1024
      enabled-encodings: gzip,deflate
    main:
       lazy-initialization: true

spring:
  application:
    name: SCORM-LMS
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgresql-dev}
  main:
    allow-bean-definition-overriding: false
  jmx:
    enabled: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
  # HEMIS OAuth2 client faqat `hemis-oauth` profili bilan yoqiladi.
  # Endpoint va credentiallar application-hemis-oauth.yml orqali olinadi.

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Petstore demo'siga tushib qolmaslik uchun: query-config o'chiq,
    # default (petstore) URL bloklangan — har doim shu loyiha API'si ochiladi
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    filter: true
    persist-authorization: true
    display-request-duration: true
    display-operation-id: true
    default-models-expand-depth: 1
    deep-linking: true
    try-it-out-enabled: true

  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  model-and-view-allowed: false


app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://172.16.10.159:8080,http://localhost:5173,http://localhost:4173,http://localhost:8080}
  seed:
    admin-password: ${APP_SEED_ADMIN_PASSWORD:}
    teacher-password: ${APP_SEED_TEACHER_PASSWORD:}
    student-password: ${APP_SEED_STUDENT_PASSWORD:}
  jwt:
    # HS512 uchun kamida 64 baytlik secret talab qilinadi.
    # Prod muhitda JWT_SECRET env variable orqali beriladi; default faqat lokal dev uchun.
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789abcdefghijklmnop}
    expiration: 86400000 # 24 hours in milliseconds
    refresh-expiration: 2592000000 # 30 days in milliseconds
    header: Authorization
    token-prefix: "Bearer "
    token-type: Bearer

  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads}
  scorm:
    storage-dir: ${SCORM_STORAGE_DIR:./private/scorm}
    max-package-bytes: ${SCORM_MAX_PACKAGE_BYTES:209715200}
    secure-cookie: ${SCORM_SECURE_COOKIE:false}
  assignment:
    storage-dir: ${ASSIGNMENT_STORAGE_DIR:./private/assignments}
    max-file-bytes: ${ASSIGNMENT_MAX_FILE_BYTES:10485760}
  course-content:
    storage-dir: ${COURSE_CONTENT_STORAGE_DIR:./private/course-content}
    max-file-bytes: ${COURSE_CONTENT_MAX_FILE_BYTES:209715200}
  survey:
    anonymization-secret: ${SURVEY_ANONYMIZATION_SECRET:${JWT_SECRET:dev-only-survey-secret-do-not-use-in-production}}
  announcement:
    # Optional provider webhooks. Empty values intentionally keep EMAIL/PUSH in FAILED audit state.
    email-webhook-url: ${ANNOUNCEMENT_EMAIL_WEBHOOK_URL:}
    email-webhook-token: ${ANNOUNCEMENT_EMAIL_WEBHOOK_TOKEN:}
    push-webhook-url: ${ANNOUNCEMENT_PUSH_WEBHOOK_URL:}
    push-webhook-token: ${ANNOUNCEMENT_PUSH_WEBHOOK_TOKEN:}
  video-conference:
    # Provider-specific credentials stay behind an institution adapter implementing the documented neutral contract.
    # Empty values intentionally make provisioning fail closed and keep the failure in the meeting audit record.
    provider-code: ${VIDEO_CONFERENCE_PROVIDER_CODE:UNCONFIGURED}
    provision-url: ${VIDEO_CONFERENCE_PROVISION_URL:}
    token: ${VIDEO_CONFERENCE_TOKEN:}
  integration:
    max-attempts: ${INTEGRATION_MAX_ATTEMPTS:5}
    retry-base-seconds: ${INTEGRATION_RETRY_BASE_SECONDS:30}
    retry-max-seconds: ${INTEGRATION_RETRY_MAX_SECONDS:3600}
    worker:
      enabled: ${INTEGRATION_WORKER_ENABLED:true}
      fixed-delay-ms: ${INTEGRATION_WORKER_FIXED_DELAY_MS:30000}
      initial-delay-ms: ${INTEGRATION_WORKER_INITIAL_DELAY_MS:30000}
  hemis:
    oauth:
      frontend-callback-url: ${HEMIS_OAUTH_FRONTEND_CALLBACK_URL:http://localhost:5173/auth/hemis/callback}
      id-attribute: ${HEMIS_OAUTH_ID_ATTRIBUTE:id}
      username-attribute: ${HEMIS_OAUTH_USERNAME_ATTRIBUTE:login}
      login-code-ttl-seconds: ${HEMIS_OAUTH_LOGIN_CODE_TTL_SECONDS:60}
    sync:
      enabled: ${HEMIS_SYNC_ENABLED:false}
      async-enabled: ${HEMIS_SYNC_ASYNC_ENABLED:true}
      page-size: ${HEMIS_SYNC_PAGE_SIZE:100}
      cron: ${HEMIS_SYNC_CRON:0 0 */6 * * *}
  support:
    sla:
      policy-version: ${SUPPORT_SLA_POLICY_VERSION:1.0}
      low-response-hours: ${SUPPORT_SLA_LOW_RESPONSE_HOURS:24}
      low-resolution-hours: ${SUPPORT_SLA_LOW_RESOLUTION_HOURS:120}
      normal-response-hours: ${SUPPORT_SLA_NORMAL_RESPONSE_HOURS:8}
      normal-resolution-hours: ${SUPPORT_SLA_NORMAL_RESOLUTION_HOURS:72}
      high-response-hours: ${SUPPORT_SLA_HIGH_RESPONSE_HOURS:4}
      high-resolution-hours: ${SUPPORT_SLA_HIGH_RESOLUTION_HOURS:24}
      urgent-response-hours: ${SUPPORT_SLA_URGENT_RESPONSE_HOURS:1}
      urgent-resolution-hours: ${SUPPORT_SLA_URGENT_RESOLUTION_HOURS:4}
  security:
    trusted-proxy-ips: ${TRUSTED_PROXY_IPS:}
    rate-limit:
      window-seconds: ${AUTH_RATE_WINDOW_SECONDS:900}
      login-per-ip: ${AUTH_LOGIN_PER_IP:30}
      external-auth-per-ip: ${AUTH_EXTERNAL_PER_IP:20}
      token-per-ip: ${AUTH_TOKEN_PER_IP:60}
      max-buckets: ${AUTH_RATE_MAX_BUCKETS:10000}

hemis:
  host: ${HEMIS_HOST:https://student.namdtu.uz}
  api-base-path: /rest/v1
  # Admin kreditsiallari — muassasaga HEMIS tomonidan berilgan
  admin-login: ${HEMIS_ADMIN_LOGIN:}
  admin-password: ${HEMIS_ADMIN_PASSWORD:}


# File Storage Configuration
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  max-file-size: 10MB
  allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx

# Private, authorization-gated UAT evidence. Never map this directory as a public resource.
uat:
  private-storage-dir: ${UAT_PRIVATE_STORAGE_DIR:./private-uploads/uat-559}
