logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    uz.scorm.lms: DEBUG

management:
  health:
    elasticsearch:
      enabled: false
spring:
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false
  jackson:
    serialization:
      indent-output: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scorm_lms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      poolName: Hikari
      auto-commit: false
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://172.16.10.159:8080,http://localhost:5173,http://localhost:4173,http://localhost:8080}
  jwt:
    # Faqat lokal development uchun. Production profilda JWT_SECRET majburiy.
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789abcdefghijklmnop}
  scorm:
    secure-cookie: ${SCORM_SECURE_COOKIE:false}
  survey:
    anonymization-secret: ${SURVEY_ANONYMIZATION_SECRET:${JWT_SECRET:dev-only-survey-secret-do-not-use-in-production}}
