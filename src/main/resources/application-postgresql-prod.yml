# ===================================================================
# Production profil sozlamalari (postgresql-prod)
# Umumiy sozlamalar application.yml da; bu fayl faqat prod uchun
# farq qiladigan qiymatlarni o'z ichiga oladi.
#
# Hech qanday env fayl shart emas: WAR'ni Tomcat'ga tashlash yetarli.
# Quyidagi barcha qiymatlarning standarti bor; kerak bo'lsa env orqali almashtiriladi:
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, SURVEY_ANONYMIZATION_SECRET,
#   CORS_ALLOWED_ORIGINS, APP_DATA_DIR (yoki alohida *_DIR), HEMIS_HOST, HEMIS_API_TOKEN
# Standartlar: baza localhost:5432/scorm_lms (rol scorm_lms), fayllar Tomcat katalogidagi
# scorm-lms-data/ ichida, JWT siri har ishga tushganda tasodifiy (barqaror sessiya uchun JWT_SECRET bering).
# ===================================================================

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN
    uz.scorm.lms: INFO
  # Fayl ko'rsatilmasa rollingpolicy ishlamaydi — loglar faqat konsolga chiqib yo'qoladi.
  # Standart: Tomcat'ning o'z logs/ katalogi (Tomcat foydalanuvchisi yoza oladi).
  file:
    name: ${LOG_FILE:${catalina.base:.}/logs/scorm-lms.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB

server:
  # So'rovlar tugashini kutib, keyin to'xtaydi (deploy paytida so'rov uzilmaydi)
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 210MB
    threads:
      max: 200
      min-spare: 10

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scorm_lms}
    username: ${DB_USERNAME:scorm_lms}
    # Standart parol faqat localhost'dagi bazaga ulanish uchun; serverda `ALTER ROLE scorm_lms PASSWORD '...'`
    # qilib DB_PASSWORD ni ham shunga moslang.
    password: ${DB_PASSWORD:scorm-lms-default-db-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      poolName: Hikari
      auto-commit: false
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000      # 30s — connection olish uchun maksimal kutish
      idle-timeout: 600000           # 10 min — bo'sh connection yopilishi
      max-lifetime: 1800000          # 30 min — connection maksimal umri
      leak-detection-threshold: 60000 # 60s dan uzoq qaytarilmagan connection log'ga yoziladi
      validation-timeout: 5000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        reWriteBatchedInserts: true
        currentSchema: ${DB_SCHEMA:public}

  # Production schema versiyalari db/migration ichidagi o'zgarmas Flyway
  # migratsiyalari orqali boshqariladi.
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}
    create-schemas: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
      # location berilmaydi: vaqtinchalik qismlar Tomcat'ning temp katalogiga yoziladi (u doim mavjud).

# Actuator: faqat kerakli endpointlar ochiladi (health/info permitAll,
# qolganlari SecurityConfig bo'yicha autentifikatsiya talab qiladi)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true   # /actuator/health/liveness va /readiness (k8s/docker uchun)
  health:
    elasticsearch:
      enabled: false
  info:
    build:
      enabled: true
    java:
      enabled: true

# Prodda Swagger default o'chiq; vaqtincha kerak bo'lsa SWAGGER_ENABLED=true qo'yilsin
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  # Barcha yuklanadigan/saqlanadigan fayllar shu katalog ichida (kataloglar kerak bo'lganda yaratiladi).
  data-dir: ${APP_DATA_DIR:${catalina.base:.}/scorm-lms-data}
  upload:
    dir: ${FILE_UPLOAD_DIR:${app.data-dir}/uploads}
  face:
    model-dir: ${FACE_MODEL_DIR:${app.data-dir}/face-models}
  assignment:
    storage-dir: ${ASSIGNMENT_STORAGE_DIR:${app.data-dir}/assignments}
  course-content:
    storage-dir: ${COURSE_CONTENT_STORAGE_DIR:${app.data-dir}/course-content}
  cors:
    # Nginx namunasida frontend va /api bitta domenda, shuning uchun CORS ishlamaydi va standart yetarli.
    # Frontend boshqa domenda bo'lsa CORS_ALLOWED_ORIGINS ga aniq HTTPS originlarni bering (wildcard emas).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost}
  jwt:
    # Berilmasa har ishga tushganda tasodifiy sir hosil bo'ladi (xavfsiz); qayta ishga tushganda
    # foydalanuvchilar qaytadan kiradi. Barqaror sessiya uchun JWT_SECRET bering.
    secret: ${JWT_SECRET:${random.value}${random.value}${random.value}}
  scorm:
    secure-cookie: ${SCORM_SECURE_COOKIE:true}
    storage-dir: ${SCORM_STORAGE_DIR:${app.data-dir}/scorm}
  survey:
    # Anonim so'rovnoma xeshi qayta ishga tushganda o'zgarmasligi kerak, shuning uchun standart
    # tasodifiy emas: baza parolidan olinadi. Alohida SURVEY_ANONYMIZATION_SECRET berish tavsiya etiladi.
    anonymization-secret: ${SURVEY_ANONYMIZATION_SECRET:${JWT_SECRET:scorm-lms-survey-anonymization-secret-derived-from-database-password-${spring.datasource.password}}}

file:
  upload-dir: ${FILE_UPLOAD_DIR:${app.data-dir}/uploads}

# Private, authorization-gated UAT dalillari (public static route'ga ulanmaydi)
uat:
  private-storage-dir: ${UAT_PRIVATE_STORAGE_DIR:${app.data-dir}/uat-559}
